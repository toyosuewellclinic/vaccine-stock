<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ワクチン在庫</title>
<style>
*{box-sizing:border-box}
body{margin:8px;padding:0;font-family:sans-serif}
#vsw .upd{font-size:12px;color:#888;text-align:right;margin-bottom:12px}
#vsw .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#27ae60;margin-right:4px;vertical-align:middle}
#vsw h3{font-size:15px;font-weight:bold;margin:20px 0 6px;padding:6px 12px;border-left:4px solid #0066cc;background:#f0f4f8;color:#1a2332}
#vsw table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
#vsw th{background:#f0f4f8;padding:7px 10px;text-align:left;font-weight:bold;border:1px solid #dde4ec;color:#333}
#vsw td{padding:7px 10px;border:1px solid #dde4ec;vertical-align:middle;word-break:break-all}
#vsw tr:nth-child(even) td{background:#f8fafc}
#vsw .q{text-align:center;font-weight:bold;font-size:14px;white-space:nowrap;min-width:50px}
#vsw .q.out{color:#c0392b}
#vsw .q.low{color:#e67e22}
#vsw .q.ok{color:#27ae60}
#vsw .stale{font-size:13px;color:#c0392b;margin:0 0 12px}
</style>
</head>
<body>
<div id="vsw"><p style="color:#888">⏳ 在庫情報を読み込み中...</p></div>
<script>
!function(){
  // 在庫数は同じ場所の stock.json から読む。院内の在庫から定期的に書き出している
  // (品目・価格の一覧もそのファイルに入っている。このページは表示するだけ)。
  var STALE_HOURS = 48;   // これより古いときは「更新が止まっている」と断る

  // 読み込んだ値や例外メッセージを HTML に入れる前に必ずエスケープする。
  // このページは他の GitHub Pages と同一オリジンのため、ここでスクリプトが動くと隣のページの保存データまで読まれる。
  function esc(v) {
    return String(v).replace(/[&<>"']/g, function(ch) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch];
    });
  }
  function row(c) {
    var q = '<span style="color:#bbb">－</span>', cls = '';
    if (c.stock !== null && c.stock !== undefined && isFinite(Number(c.stock))) {
      var stock = Number(c.stock), min = Number(c.min);
      var qty = stock + ' ' + esc(c.unit || '個');
      if (stock <= 0) { cls = 'out'; q = '終了'; }
      else if (isFinite(min) && stock < min) { cls = 'low'; q = qty; }
      else { cls = 'ok'; q = qty; }
    }
    return '<tr><td>' + esc(c.v || '') + '</td><td>' + esc(c.b || '') + '</td><td class="q ' + cls + '">' + q + '</td><td>' + esc(c.p || '') + '</td></tr>';
  }
  function tbl(list) {
    var r = '';
    for (var i = 0; i < list.length; i++) r += row(list[i]);
    return '<table><thead><tr><th>ワクチン名</th><th>商品名</th><th style="text-align:center">在庫</th><th>価格</th></tr></thead><tbody>' + r + '</tbody></table>';
  }

  var w = document.getElementById('vsw');
  fetch('stock.json?t=' + Date.now(), { cache: 'no-store' }).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(data) {
    var at = new Date(data.updated_at);
    var ok = !isNaN(at.getTime());
    var stale = !ok || (Date.now() - at.getTime()) > STALE_HOURS * 3600 * 1000;
    var dt = ok ? at.toLocaleDateString('ja-JP', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    }) + ' 時点' : '';
    var html = '<div class="upd">' + (stale ? '' : '<span class="dot"></span>') + esc(dt) + '</div>';
    if (stale) html += '<p class="stale">在庫数の更新が止まっています。最新の在庫はお電話でご確認ください。</p>';
    var secs = data.sections || [];
    for (var i = 0; i < secs.length; i++) {
      html += '<h3>' + esc(secs[i].title || '') + '</h3>' + tbl(secs[i].items || []);
    }
    w.innerHTML = html;
    try {
      window.parent.postMessage({ iframeHeight: document.body.scrollHeight + 20 }, '*');
    } catch (e) {}
  }).catch(function(err) {
    w.innerHTML = '<p style="color:red">⚠️ 読み込みエラー: ' + esc(err && err.message) + '</p>';
  });
}();
</script>
</body>
</html>
